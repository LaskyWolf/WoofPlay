name: WoofPlay
options:
  bundleIdPrefix: com.laskywolf
  deploymentTarget:
    iOS: "26.0"
  # An .icon is a folder that Xcode reads as one file.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  SwiftyTube:
    url: https://github.com/686udjie/SwiftyTube.git
    exactVersion: 0.0.9
  # This fork adds mpv's video output for Apple's sample buffer layer, which Picture in Picture needs.
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    exactVersion: 0.41.0-av5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "36"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WoofPlay:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: WoofPlay
    dependencies:
      - package: SwiftyTube
      - package: MPVKit
        product: MPVKit-GPL
      - target: WoofPlayShare
      # Built by Torrent/build.sh. A static library, so nothing is embedded.
      - framework: Torrent/TorrentNative.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.woofplay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Amber Brown Cyan Green Indigo Lime Orange Pink Purple Red Teal"
    info:
      path: WoofPlay/Info.plist
      properties:
        CFBundleDisplayName: WoofPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.laskywolf.woofplay.links
            CFBundleURLSchemes:
              - woofplay
              - youtube
              - vnd.youtube
          - CFBundleURLName: com.laskywolf.woofplay.magnet
            CFBundleURLSchemes:
              - magnet
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # Adds WoofPlay to the share sheet for YouTube and magnet links.
  WoofPlayShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.woofplay.share
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: WoofPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
