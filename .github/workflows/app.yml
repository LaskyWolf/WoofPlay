name: Native app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      # The torrent engine is compiled from pinned libtorrent source, and rebuilt only when its files change.
      - name: Restore the torrent engine
        id: torrent
        uses: actions/cache@v6.1.0
        with:
          path: app/Torrent/TorrentNative.xcframework
          key: torrent-${{ hashFiles('app/Torrent/build.sh', 'app/Torrent/CMakeLists.txt', 'app/Torrent/bridge.cpp', 'app/Torrent/include/**') }}

      - name: Build the torrent engine
        if: steps.torrent.outputs.cache-hit != 'true'
        working-directory: app/Torrent
        run: |
          brew install boost ninja
          ./build.sh

      - name: Generate the Xcode project
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: app
        run: |
          xcodebuild -project WoofPlay.xcodeproj -scheme WoofPlay -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the IPA
        working-directory: app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WoofPlay.app Payload/
          zip -qr WoofPlay.ipa Payload

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofPlay-native
          path: app/WoofPlay.ipa
          retention-days: 1

      # Turns the addresses in a crash report back into function names.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofPlay-dSYM
          path: app/build/Build/Products/Release-iphoneos/WoofPlay.app.dSYM
          retention-days: 30
